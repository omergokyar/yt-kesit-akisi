[project]
name = "yt-kesit-akisi"
version = "1.0.0"
description = "Farsca dublajli dizi bolumlerinden uzun kesit ve Shorts ureten is akisi"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "faster-whisper==1.2.1",
    "scenedetect==0.7.2",
    "opencv-python==5.0.0.93",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
